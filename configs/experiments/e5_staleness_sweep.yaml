# e5_staleness_sweep.yaml — Configuration for Experiment E5: Controlled Synchronization Staleness Sweep
# Research project: Quantifying the Effect of Digital Twin Synchronization Staleness on
# Joint Short-Term Load Estimation and Unsupervised Anomaly Detection

experiment:
  id: E5
  name: staleness_sweep
  description: >
    Systematically evaluates the effect of Digital Twin synchronization staleness (Delta t)
    and stochastic packet drops (P_drop) on joint short-term load estimation (Persistence, XGBoost, LSTM)
    and unsupervised anomaly detection (Isolation Forest, LSTM Autoencoder on Raw and Residual representations).
  seed: 42
  version: "1.0.0"

synchronization:
  # Frozen experimental matrix Factor A: Staleness intervals (seconds)
  intervals_seconds:
    - 0
    - 1
    - 5
    - 15
    - 60
    - 300

  # Frozen experimental matrix Factor B: Packet drop probabilities
  packet_drop_rates:
    - 0.0
    - 0.05
    - 0.10
    - 0.20

  # Authoritative policy when an update is missed or dropped
  missed_update_policy: hold_last_state

  # Age of Information tracking configuration
  aoi:
    definition: time_since_last_update
    max_aoi_seconds: null

forecasting:
  models:
    - persistence
    - xgboost
    - lstm
  target_name: total_load_p_kw
  lookback_steps: 24
  metrics:
    primary:
      - mae
      - rmse
      - mape

anomaly_detection:
  detectors:
    - isolation_forest
    - lstm_autoencoder
  input_representations:
    - raw
    - residual
  threshold_percentile: 95.0
  metrics:
    primary:
      - precision
      - recall
      - f1
      - pr_auc
    secondary:
      - roc_auc
      - false_positive_rate
      - detection_latency

reproducibility:
  seed: 42
  output_base_dir: experiments/runs
