# Phase 13 — IEEE TSG Manuscript Assembly & Scientific Audit Configuration
# All values reference frozen artifacts from Phases 7–12.
# DO NOT modify source run paths or canonical values without justification.

phase13:
  # ─── Source Runs (frozen, read-only) ───────────────────────────────────
  source_runs:
    phase7_e4:
      path: "experiments/runs/E4_RAW_VS_RESIDUAL_SEED42_20260930"
      frozen: true
      description: "Phase 7 E4 Canonical Baseline (Δt=0s, Pdrop=0%, Seed=42)"

    phase8_e5:
      path: "experiments/runs/E5_STALENESS_SWEEP_CORRECTED_SEED42_20260930"
      frozen: true
      description: "Phase 8 E5 Factorial Staleness Sweep (24 conditions, Seed=42)"

    phase9_e6:
      path: "experiments/runs/E6_JOINT_ANALYSIS_SEED42_20261002"
      frozen: true
      description: "Phase 9 E6 Single-Seed Joint Analysis and H3 Testing"

    phase10_e10:
      path: "experiments/runs/E10_MULTI_SEED_ANALYSIS_20261002"
      frozen: true
      description: "Phase 10 E10 Multi-Seed Uncertainty (5 seeds × 24 conditions)"

    phase11_e11:
      path: "experiments/runs/E11_PHASE11_20261002"
      frozen: true
      description: "Phase 11 E11 Reproducibility, Ablations A1-A8, Transient Analysis"

    phase12_e12:
      path: "experiments/runs/E12_PUBLICATION_ARTIFACTS_20261002"
      frozen: true
      description: "Phase 12 Publication-Ready Figures, Tables, and LaTeX Fragments"

  # ─── Output Configuration ──────────────────────────────────────────────
  output:
    root: "experiments/runs/E13_MANUSCRIPT_SUBMISSION_20261002"

  # ─── Publication Metadata ──────────────────────────────────────────────
  publication:
    target: "IEEE Transactions on Smart Grid"
    feeder: "IEEE 33-Bus Radial Benchmark Feeder"
    dataset: "Pecan Street Dataport (15-Minute Resolution)"
    seeds: [42, 123, 456, 789, 101112]
    staleness_seconds: [0, 1, 5, 15, 60, 300]
    packet_drop_rates: [0.00, 0.05, 0.10, 0.20]
    conditions_per_seed: 24
    total_seed_conditions: 120
    detectors: ["isolation_forest", "lstm_autoencoder"]
    representations: ["raw", "residual"]
    forecasters: ["persistence", "xgboost", "lstm"]

  # ─── Verification Tolerances ───────────────────────────────────────────
  verification:
    numerical_tolerance: 1.0e-4
    mape_tolerance: 0.5  # MAPE values are approximate

  # ─── Canonical Claims Registry ─────────────────────────────────────────
  # Each claim maps to a specific frozen artifact value.
  # These are verified against actual files during audit.
  canonical_claims:
    # --- E4 Baseline F1 Scores (seed=42, Δt=0, Pdrop=0) ---
