[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dt-power-grid"
version = "0.1.0"
description = "Quantifying the Effect of Digital Twin Synchronization Staleness on Joint Short-Term Load Estimation and Unsupervised Anomaly Detection in a Distribution-Feeder Digital Twin"
authors = [
    { name = "Digital Twin Power Grid Research Team" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["digital-twin", "power-systems", "load-forecasting", "anomaly-detection", "synchronization"]

dependencies = [
    # Scientific computing stack
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",

    # Machine learning
    "scikit-learn>=1.3",
    "xgboost>=2.0",

    # Power systems simulation
    # NOTE: opendssdirect.py provides Python bindings for OpenDSS
    # Install separately if Windows-only build issues occur
    "opendssdirect.py>=0.8",

    # Configuration and validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",

    # Visualization
    "matplotlib>=3.7",

    # CLI
    "click>=8.1",

    # Utilities
    "python-dotenv>=1.0",
    "rich>=13.0",       # Rich terminal output for CLI
    "tqdm>=4.65",       # Progress bars for long experiments
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",

    # Code quality
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
]

dl = [
    # Deep learning (optional — install when implementing LSTM models)
    # Choose ONE of: tensorflow or torch. Uncomment the preferred framework.
    # "tensorflow>=2.13",
    # "torch>=2.0",
    # "torchmetrics>=1.0",
]

notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "nbformat>=5.9",
]

[project.scripts]
dt-grid = "src.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
namespaces_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require full stack)",
    "validation: Physical validation tests (require OpenDSS)",
    "regression: Regression tests against locked outputs",
    "slow: Tests that take >10 seconds",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/cli/*",
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
