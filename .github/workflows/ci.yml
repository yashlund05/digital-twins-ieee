name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "experiment/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test & Quality (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code style check (ruff format)
        run: |
          ruff format --check .

      - name: Lint check (ruff check)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          mypy src/

      - name: Run test suite (pytest)
        run: |
          pytest -v --tb=short
