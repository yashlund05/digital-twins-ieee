    experiment: "Benchmark AoI-adaptive threshold tau(AoI) and per-seed validation calibration."
    hypothesis: "Dynamic AoI-adaptive thresholding preserves F1 > 0.60 at dt=5s and reduces cross-seed FPR to < 0.05."
    method: "tau(AoI) = tau_0 + gamma * sqrt(AoI) calibrated strictly on validation partition."
    dataset: "Pecan Street mapped to IEEE 33-bus (test partition, 5256 timesteps, 244 anomalies)."
    seeds: [42, 123, 456, 789, 101112]
    metrics: ["F1", "Precision", "Recall", "FPR", "PR-AUC", "Cross-seed F1 variance"]
    statistical_test: "Paired Wilcoxon signed-rank test across seeds, ANOVA variance decomposition."
    acceptance_criteria: "Cross-seed mean F1 improves from 0.0887 to > 0.60 under adaptive thresholding on non-42 seeds."
    status: "READY_FOR_EXECUTION"
    evidence: "Theoretical AoI-residual variance scaling law sigma^2 ~ AoI."
    limitations: "Requires tracking realized AoI at inference time."

